name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.9"
            os: ubuntu-latest
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run test suite
        run: python -m pytest tests -q

  packaging:
    name: wheel contains core + sci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()

          required = [
              "metathin/__init__.py",
              "metathin_plus/__init__.py",
              "metathin_plus/sci/__init__.py",
              "metathin_plus/sci/memory/__init__.py",
              "metathin_plus/sci/memory/pretrained/basic_functions.json",
          ]
          missing = [p for p in required if p not in names]
          assert not missing, f"wheel is missing: {missing}"

          print(f"{wheel}: {len(names)} entries, core + sci present")
          PY

      - name: Install wheel and import sci
        run: |
          WHEEL=$(ls dist/*.whl)
          python -m pip install "${WHEEL}[sci]"
          python -c "import metathin_plus.sci as sci; print('sci', sci.__version__); print(len(sci.__all__), 'exports')"
